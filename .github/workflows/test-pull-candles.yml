name: TEMP - Test Pull Todays Candles (manual, read-only)
# Temporary test workflow -- safe to delete once you're done testing.
# Manual trigger only (no schedule). Runs test_pull_today_candles.py,
# which never calls the webhook and never writes state.json or the real
# prev_day_candles.json cache -- pure read/inspect, no side effects on the
# live system.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pull-candles:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run standalone candle test (read-only)
        env:
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
        run: python test_pull_today_candles.py
