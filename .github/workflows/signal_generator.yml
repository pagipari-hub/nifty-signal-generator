name: NIFTY Weekly Options - Signal Generator (Angel One data)
# FIX (2026-07-13, dual-trigger root cause): GitHub's own `schedule:` cron
# is best-effort and documented to drift/delay under load -- unacceptable
# for a 5-min candle-close check -- so timing authority was moved to an
# external service that calls workflow_dispatch on its own precise timer
# (see repo notes / Render service). The `schedule:` block below was never
# removed when that happened, so BOTH triggers were firing on overlapping
# ~5-min cadences. `concurrency: cancel-in-progress: false` doesn't prevent
# this -- it just queues the second run, and two runs landing back-to-back
# both committing state.json is exactly what produced the
# non-fast-forward push rejections. workflow_dispatch is now the sole
# trigger; the external service is the single source of timing truth.
on:
  workflow_dispatch:

permissions:
  contents: write

# FIX (1.7): without this, a slow run (rate-limit retries, broker latency)
# can still be executing when the next 5-min cron tick fires. Two overlapping
# runs both read state.json as "no open position" and could both fire an
# entry -- this is the duplicate-entry risk. `cancel-in-progress: false`
# is intentional: we want the in-flight run to finish managing whatever it's
# doing, not get killed mid-way through an exit/entry decision. The new run
# will simply queue and run after, picking up the now-current state.json.
concurrency:
  group: nifty-signal-generator
  cancel-in-progress: false

jobs:
  generate-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    # FIX (1.1): the workflow's cron triggers are correctly converted to IST,
    # but strategy.py's own datetime.now() calls were still naive UTC. Setting
    # TZ here makes datetime.now() return IST directly inside the job, so the
    # EOD square-off check (15:20 IST) and all state/webhook timestamps are
    # correct without needing zoneinfo plumbing through every call site.
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # FIX (2.1): instrument_master.json was never persisted between runs
      # (fresh checkout every time), so angelone_client.py's same-day cache
      # check always missed and the file was re-downloaded on every single
      # invocation (~75x/day on this schedule). Cache keyed on the IST date
      # so it naturally invalidates once per trading day.
      - name: Restore instrument master cache
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: instrument_master.json
          key: instrument-master-${{ steps.date.outputs.today }}

      # FIX (2026-07-10, session-per-run root cause): previously every run
      # called angelone_client.login(), a full TOTP-based generateSession(),
      # every 5 minutes all day. Angel One's docs state a session stays
      # active until 12 midnight, and the SDK's lightweight
      # generateToken(refresh_token) renewal (no TOTP) is the intended way
      # to keep reusing it. angel_session.json holds the cached
      # access/refresh tokens for angelone_client.login_with_cache() to
      # reuse across runs -- cached via actions/cache the same way
      # instrument_master.json is, so it self-invalidates once per trading
      # day. Deliberately NOT added to the "git add" line below: this file
      # holds a live credential (refresh token), and committing it would
      # bake that credential into the repo's permanent git history on
      # every single run. The Actions cache has no such permanence.
      - name: Restore Angel One session cache
        uses: actions/cache@v4
        with:
          path: angel_session.json
          key: angel-session-${{ steps.date.outputs.today }}

      - name: Run signal generation
        id: run_strategy
        env:
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SHARED_SECRET: ${{ secrets.WEBHOOK_SHARED_SECRET }}
        run: python main.py

      # FIX (alerting): previously a crashed run was silent -- the only way
      # to find out was manually opening the Actions tab. This fires ONLY
      # when the step above failed (`if: failure()`), pinging the same
      # Telegram bot already used for trade alerts so a crash is never
      # missed during market hours. Requires TELEGRAM_BOT_TOKEN and
      # TELEGRAM_CHAT_ID to be added as repo secrets (Settings > Secrets
      # and variables > Actions) -- they currently only exist on Render.
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="⚠️ NIFTY signal-generator run FAILED at $(date '+%Y-%m-%d %H:%M:%S %Z'). Check GitHub Actions logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$MSG" \
            || echo "Failed to send Telegram alert (non-fatal, won't block the job)."

      # FIX (2026-07-13, push-rejected-on-fast-forward root cause): the
      # overlapping-run guard in locking.py (run.lock) is a NO-OP on GitHub
      # Actions -- run.lock is never added to `git add` below and is never
      # restored via actions/cache the way instrument_master.json and
      # angel_session.json are, so every scheduled tick gets a completely
      # fresh checkout with no lock file present. acquire_run_lock() always
      # sees the file missing and returns True immediately. The `concurrency:`
      # block above serializes THIS workflow's own runs, but it can't stop
      # main from moving between this job's checkout and its push -- e.g. a
      # manual commit landing on main mid-run, or GitHub coalescing/delaying
      # scheduled triggers and then firing them in a burst. Any of those
      # leaves this job's local main behind origin/main, so `git push` gets
      # a non-fast-forward rejection ("! [rejected] main -> main (fetch
      # first)") even though nothing is actually wrong -- state.json,
      # prev_day_candles.json and candle_history/*.csv are pure bot-owned
      # machine state with well-understood "latest run wins" semantics, not
      # something that needs a human to resolve a merge conflict on.
      #
      # Fix: on a rejected push, pull --rebase with `-X ours` (our commit's
      # version of these files wins over whatever's upstream) and retry, up
      # to 3 times. This keeps the original FIX (1.8) behavior for a REAL
      # problem: if the rebase itself fails outright (e.g. a genuine
      # unresolvable divergence), we still fail loudly rather than silently
      # swallowing it.
      - name: Commit updated state back to repo
        run: |
          git config user.name "signal-bot"
          git config user.email "actions@github.com"
          git add state.json prev_day_candles.json candle_history/*.csv 2>/dev/null || true

          # Track whether this run actually created a commit, so we know
          # afterward whether a push failure is real or a harmless no-op.
          COMMITTED=false
          if ! git diff --quiet --cached; then
            git commit -m "Update state [skip ci]"
            COMMITTED=true
          fi

          if [ "$COMMITTED" != "true" ]; then
            git push || echo "Nothing to push."
            exit 0
          fi

          # Retry loop: rebase onto whatever's now on origin/main, letting
          # OUR version of the bot-owned files win any conflict, then retry
          # the push. This is safe specifically because every file we
          # touch here is machine-generated state with no human authorship
          # to lose -- unlike strategy.py/config.py/etc., which we never
          # touch in this step.
          PUSHED=false
          for i in 1 2 3; do
            if git push; then
              PUSHED=true
              break
            fi

            echo "Push rejected (attempt $i/3) -- pulling and rebasing, preferring our state files on conflict..."
            if ! git pull --rebase -X ours origin main; then
              echo "::error::git rebase failed while reconciling state.json changes -- this is a genuine conflict, not just a fast-forward race. Needs manual inspection."
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error::git push still failing after 3 rebase-and-retry attempts -- state may be out of sync. Inspect state.json manually."
            exit 1
          fi
