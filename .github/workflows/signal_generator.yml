name: NIFTY Weekly Options - Signal Generator (Angel One data)
# schedule re-sync trigger - 2026-06-25
on:
  schedule:
    - cron: "45,50,55 3 * * 1-5"        # 09:15,09:20,09:25 IST
    - cron: "*/5 4,5,6,7,8,9 * * 1-5"   # 09:30-15:25 IST
    - cron: "0 10 * * 1-5"              # 15:30 IST, EOD square-off tick
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal generation
        env:
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SHARED_SECRET: ${{ secrets.WEBHOOK_SHARED_SECRET }}
        run: python strategy.py

      - name: Commit updated state back to repo
        run: |
          git config user.name "signal-bot"
          git config user.email "actions@github.com"
          git add state.json 2>/dev/null || true
          git diff --quiet --cached || git commit -m "Update state [skip ci]"
          git push || echo "Nothing to push"
