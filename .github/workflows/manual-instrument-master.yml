name: Manual - Cache Angel Instrument Master

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-instrument-master:
    runs-on: ubuntu-latest
    steps:
      - name: Download instrument master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          url="https://margincalculator.angelbroking.com/OpenAPI_File/files/OpenAPIScripMaster.json"
          echo "Downloading Angel One instrument master..."
          curl -fL --retry 2 --retry-delay 3 --connect-timeout 10 --max-time 120 \
            "$url" -o data/instrument_master.json
          test -s data/instrument_master.json
          python - <<'PY'
          import json
          p = "data/instrument_master.json"
          with open(p, encoding="utf-8") as f:
              data = json.load(f)
          if not isinstance(data, list) or not data:
              raise SystemExit("Instrument master JSON is not a non-empty list")
          print(f"JSON OK: {len(data):,} instruments")
          PY
          ls -lh data/instrument_master.json

      - name: Commit instrument master to repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Move downloaded file into checked-out repository
        shell: bash
        run: |
          set -euo pipefail
          # The download step ran before checkout, so the file is in the
          # workspace already; checkout preserves it unless a tracked file exists.
          test -s data/instrument_master.json

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instrument_master.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Cache Angel instrument master"
          git push
